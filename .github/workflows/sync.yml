name: Sync from Google Docs

on:
  workflow_dispatch: {}          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 11 * * *"         # daily, ~7am Eastern
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "site.config.json"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pull Google Docs
        id: sync
        run: node scripts/sync.mjs

      - name: Build site
        run: node scripts/build.mjs

      - name: Render PDFs
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          npx playwright install --with-deps chromium
          node scripts/pdf.mjs

      - name: Commit changes
        run: |
          git config user.name "docs-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/pdf
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Sync from Google Docs ($(date -u +%Y-%m-%d))"
            git push
          fi
